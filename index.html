<!DOCTYPE html>
<html lang="my" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRA - Digital Experience</title>
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neonPurple: '#7C3AED',
                        neonCyan: '#06B6D4',
                        darkBg: '#09090B',
                        darkCard: '#18181B'
                    }
                }
            }
        }
    </script>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 dark:bg-darkBg text-gray-900 dark:text-gray-100 min-h-screen font-sans antialiased transition-colors duration-300">

    <!-- Top Opaque Frosted Glow Header -->
    <header id="main-header" class="sticky top-0 z-40 bg-gray-900/95 backdrop-blur-md border-b border-purple-500/20 text-white transition-transform duration-300">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-purple-500 via-pink-500 to-cyan-400 bg-clip-text text-transparent">VYRA</span>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center space-x-2 sm:space-x-4">
                <!-- Content Filter Dropdown -->
                <select id="category-select" class="bg-gray-800/80 text-purple-300 border border-purple-500/30 text-xs sm:text-sm rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="all">Contents အားလုံး</option>
                    <option value="ai">AI & Tech</option>
                    <option value="web">Web Dev</option>
                    <option value="movies">Movies</option>
                </select>

                <button id="theme-btn" class="p-2 hover:bg-gray-800 rounded-xl text-gray-300 transition-colors">
                    <i data-lucide="moon" id="theme-icon" class="w-5 h-5"></i>
                </button>

                <button id="menu-btn" class="p-2 hover:bg-gray-800 rounded-xl text-purple-400 transition-colors">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Drawer Menu Overlay -->
    <div id="drawer-overlay" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm transition-opacity">
        <div id="drawer-content" class="fixed right-0 top-0 bottom-0 w-4/5 max-w-xs bg-darkCard p-6 border-l border-purple-500/20 shadow-2xl flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between pb-6 border-b border-gray-800">
                    <span class="text-xl font-bold text-purple-400">VYRA Menu</span>
                    <button id="close-drawer-btn" class="p-2 text-gray-400 hover:text-white">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <nav class="mt-6 space-y-3">
                    <button onclick="filterByMenu('all')" class="w-full text-left px-4 py-3 rounded-xl bg-purple-500/10 text-purple-300 font-medium hover:bg-purple-500/20">Contents အားလုံး</button>
                    <button onclick="filterByMenu('ai')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-800/60 text-gray-300">AI & Technology</button>
                    <button onclick="filterByMenu('web')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-800/60 text-gray-300">Web Development</button>
                    <button onclick="filterByMenu('movies')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-800/60 text-gray-300">Entertainment</button>
                </nav>
            </div>
            <div class="text-xs text-gray-500 text-center">VYRA Architecture © 2026</div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- DESKTOP / TABLET MASTER-DETAIL SPLIT VIEW (>768px) -->
        <div class="hidden md:grid md:grid-cols-12 gap-6 h-[calc(100vh-7.5rem)]">
            <!-- Left List Area (4 Columns) -->
            <section class="col-span-4 overflow-y-auto pr-2 space-y-4 custom-scrollbar" id="desktop-list">
                <!-- Cards render dynamically -->
            </section>

            <!-- Right Detail Area (8 Columns) -->
            <section class="col-span-8 bg-white dark:bg-darkCard border border-purple-500/20 rounded-2xl p-8 overflow-y-auto shadow-2xl relative" id="desktop-detail">
                <!-- Article Content renders dynamically -->
            </section>
        </div>

        <!-- MOBILE STACK VIEW (<768px) -->
        <div class="block md:hidden" id="mobile-container">
            <div id="mobile-list" class="space-y-4">
                <!-- Mobile Cards -->
            </div>

            <!-- Mobile Article Detail Page -->
            <div id="mobile-detail" class="hidden bg-white dark:bg-darkCard rounded-2xl p-6 border border-purple-500/20 shadow-2xl min-h-[70vh]">
                <button id="mobile-back-btn" class="mb-6 inline-flex items-center space-x-2 text-purple-400 font-bold text-sm bg-purple-500/10 px-4 py-2 rounded-xl active:scale-95 transition-transform">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>နောက်သို့ ပြန်သွားမည်</span>
                </button>
                <div id="mobile-detail-content"></div>
            </div>
        </div>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
